# Pull-request and main-branch checks (DRAFT: proposed by Tasha, needs team agreement before merge).
#
# - backend:  Python 3.12, `pip install -e ".[dev]"`, full pytest. No Ollama, no built SQLite
#             database and no Chroma index on the runner; every test uses fakes or temp data.
# - frontend: Node 22, npm ci, lint, clipboard-format tests, build.
# - audit:    pip-audit and npm audit (high+). Report only for now: never fails the build.
# - secrets:  gitleaks over the commits in the PR (or the pushed commits on main).
#
# Read-only token, no repository secrets. Held-out questions are never read: KOPI_HELDOUT_DIR is
# forced empty, nothing runs `--split heldout`, and the held-out set is not in the repo anyway
# (docs/heldout-guide.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  KOPI_HELDOUT_DIR: ""
  LANGCHAIN_TRACING_V2: "false"
  LANGSMITH_TRACING: "false"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  backend:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest -q -rs

      - name: Check policy guardrail mutations (offline)
        run: python scripts/mutation_test_policy.py --jobs 2

      - name: Save policy mutation evidence
        if: always() && hashFiles('.local/reports/policy-mutations.json') != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: policy-mutations-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/reports/policy-mutations.json
          include-hidden-files: true
          retention-days: 14

  frontend:
    name: Frontend lint and build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  audit:
    name: Dependency audit (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"

      - name: pip-audit (installed project and its dependencies)
        continue-on-error: true  # report only, for now
        run: |
          python -m pip install -e ".[dev]" pip-audit==2.10.1
          pip-audit --skip-editable

      - name: npm audit (high and above)
        continue-on-error: true  # report only, for now
        working-directory: frontend
        run: npm audit --audit-level=high

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The binary, not gitleaks-action: no token or licence needed, and the download is checksummed.
      - name: Install gitleaks
        run: |
          curl --retry 4 --retry-delay 3 --retry-max-time 180 \
            --connect-timeout 15 --max-time 60 -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      - name: Scan the new commits
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            RANGE="$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            RANGE="$PUSH_BEFORE..$PUSH_AFTER"
          else
            RANGE="$PUSH_AFTER~1..$PUSH_AFTER"
          fi
          echo "Scanning $RANGE"
          ./gitleaks git --redact --verbose --exit-code 1 --log-opts="$RANGE" .
