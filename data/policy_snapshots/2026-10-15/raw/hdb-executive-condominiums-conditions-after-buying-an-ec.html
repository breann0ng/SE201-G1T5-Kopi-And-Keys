eb"},"pageState":"normal","language":"en","itemPath":"/buying-a-flat/executive-condominiums/conditions-after-buying-an-ec"},"route":{"name":"conditions-after-buying-an-ec","displayName":"Conditions after Buying an Executive Condominium","fields":{"hidePage":{"value":false},"publishedDate":{"value":"0001-01-01T00:00:00Z"},"sidebar":{"value":true},"topicTags":[],"metaDescription":{"value":"Learn about the conditions that apply after buying an Executive Condominium (EC) from a property developer."},"navigationTitle":{"value":"Conditions After Buying an EC"},"pageDescrition":{"value":"Learn about the conditions that apply after buying an Executive Condominium from a property developer."},"pageTitle":{"value":"Conditions After Buying an Executive Condominium"}},"databaseName":"web","deviceId":"fe5d7fdf-89c0-4d99-9aa3-b5fbd009c9f3","itemId":"f83d441e-23b3-4e4d-bea2-4c088e62e4eb","itemLanguage":"en","itemVersion":1,"layoutId":"af038be7-4964-5e5b-8587-c77df5a9ad86","templateId":"69b30267-a6b6-52fa-9533-4766acd90000","templateName":"Destination Page","placeholders":{"homepage":[],"jss-main":[{"uid":"8e0c7c94-2158-444a-9ecd-ee897028c5d0","componentName":"PageHeader","dataSource":"{F83D441E-23B3-4E4D-BEA2-4C088E62E4EB}","fields":{"hidePage":{"value":false},"publishedDate":{"value":"0001-01-01T00:00:00Z"},"sidebar":{"value":true},"topicTags":[],"metaDescription":{"value":"Learn about the conditions that apply after buying an Executive Condominium (EC) from a property developer."},"navigationTitle":{"value":"Conditions After Buying an EC"},"pageDescrition":{"value":"Learn about the conditions that apply after buying an Executive Condominium from a property developer."},"pageTitle":{"value":"Conditions After Buying an Executive Condominium"}}}],"intent-landing-page":[],"destination-page":[{"uid":"5a81f5b5-7966-4588-80aa-e108d294f95e","componentName":"BodyContent","dataSource":"{5556E8E1-3614-422D-8417-C78517918F9A}","fields":{"bodyContent":{"value":"\u003cp\u003eThere are conditions that apply after you buy an EC unit from a property developer.\u003c/p\u003e\n\u003ctable style=\"width: 100%;\"\u003e\n    \u003ctbody\u003e\n        \u003ctr\u003e\n            \u003ctd style=\"width: 20%;\"\u003e\n            \u003cp\u003e\u003cstrong\u003eTaking a housing subsidy\u003c/strong\u003e\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd style=\"width: 80%;\"\u003e\n            \u003cp\u003eYou and your spouse have taken a housing subsidy when you buy an EC unit from a property developer.\u003c/p\u003e\n            \u003cp\u003e\u003cstrong\u003eCitizen Top-Up\u003c/strong\u003e\u003c/p\u003e\n            \u003cp\u003eIf you are from a Singapore Citizen (SC)/ Singapore Permanent Resident (SPR) household, you may apply for a Citizen Top-Up of $10,000 when your SPR family member obtains Singapore citizenship or when you have an SC child. Read more on the \u003ca rel=\"noopener noreferrer\" href=\"/managing-my-home/finances/citizen-topup\"\u003eCitizen Top-Up\u003c/a\u003e.\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd\u003e\n            \u003cp\u003e\u003cstrong\u003eDisposal of existing HDB flat\u003c/strong\u003e\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd\u003e\n            \u003cp\u003eYou or any person listed in the application for the EC unit must dispose of any interest in any HDB flat, within 6 months from key collection of the EC unit. This shall be based on the legal completion date of the disposal.    \u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd\u003e\n            \u003cp\u003e\u003cstrong\u003eMinimum occupation period (MOP)\u003c/strong\u003e\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd\u003e\n            \u003cp\u003e\u003cstrong\u003eSale of EC unit\u003c/strong\u003e\u003c/p\u003e\n            \u003cp\u003eEC units in \u003ca rel=\"noopener noreferrer\" href=\"https://www.hdb.gov.sg/-/media/business-partners/land-developers-and-land-users/buying-land-land-sales/sites-sold-by-hdb/ec-sites-sold.pdf?sc_lang=en\u0026amp;hash=60DB83045B226461EC2B9CDEC5DBECF0\" target=\"_blank\"\u003eprojects where the land sales tender closed on or after 8 May 2026\u003c/a\u003e can only be sold on the open market after the 10-year MOP has been met. The MOP is computed from the date of the Temporary Occupation Permit (TOP).\u003c/p\u003e\n            \u003cp\u003eFor EC units in other projects, the MOP is 5 years.\u003c/p\u003e\n            \u003cp\u003e\u003cstrong\u003eCore occupiers in EC unit\u003c/strong\u003e\u003c/p\u003e\n            \u003cp\u003eCore occupier(s) enable the household to qualify for an EC unit purchase under an eligibility scheme. All core occupier(s) must remain in the EC application, and physically reside in the EC unit during the MOP after the EC unit purchase. Their names cannot be removed. They also cannot apply or be listed in an HDB Flat Eligibility (HFE) letter to buy an HDB flat or EC unit from a property developer during the MOP. \u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd\u003e\n            \u003cp\u003e\u003cstrong\u003eRenting out your EC unit\u003c/strong\u003e\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd\u003e\n            \u003cp\u003e\u003cstrong\u003eRenting out the whole EC unit\u003c/strong\u003e\u003c/p\u003e\n            \u003cp\u003eYou may rent out the whole EC unit after the MOP.\u003c/p\u003e\n            \u003cp\u003e\u003cstrong\u003eRenting out rooms\u003c/strong\u003e\u003c/p\u003e\n            \u003cp\u003eYou do not need prior approval from HDB to rent out the bedrooms in your EC unit within the MOP. However, you must register the renting out of bedrooms with HDB within 7 days of doing so. You are also required to notify HDB when you renew or terminate the renting out of bedrooms, and when there are changes to your tenants\u0026rsquo; particulars.\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd\u003e\n            \u003cp\u003e\u003cstrong\u003eInterest in private property\u003c/strong\u003e\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd\u003e\n            \u003cp\u003eYou may invest in private residential property only after the MOP.\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd\u003e\n            \u003cp\u003e\u003cstrong\u003eBuying your next home\u003c/strong\u003e\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd\u003e\n            \u003cp\u003eYou must meet the following conditions after disposing of your EC unit on the open market before you may apply to buy an HDB flat or another EC unit from a property developer:\u003c/p\u003e\n            \u003ctable style=\"width: 100%;\"\u003e\n                \u003cthead\u003e\n                    \u003ctr\u003e\n                        \u003cth style=\"width: 65%;\"\u003eType of Application\u003c/th\u003e\n                        \u003cth style=\"width: 35%;\"\u003eConditions on Disposal of Private Residential Property\u003c/th\u003e\n                    \u003c/tr\u003e\n                \u003c/thead\u003e\n                \u003ctbody\u003e\n                    \u003ctr\u003e\n                        \u003ctd\u003e\n                        \u003cul\u003e\n                            \u003cli\u003eBuying a flat from HDB\u003c/li\u003e\n                            \u003cli\u003eBuying a resale Plus or Prime\u003csup\u003e[1]\u003c/sup\u003e flat\u003c/li\u003e\n                            \u003cli\u003eBuying a resale unclassified\u003csup\u003e[2]\u003c/sup\u003e/ Standard flat with CPF housing grant(s)\u003c/li\u003e\n                            \u003cli\u003eApplying for a housing loan from HDB\u003c/li\u003e\n                            \u003cli\u003eBuying an EC unit from a property developer\u003c/li\u003e\n                        \u003c/ul\u003e\n                        \u003c/td\u003e\n                        \u003ctd\u003e\n                        \u003cul\u003e\n                            \u003cli\u003eMust not own or have an interest in any local or overseas private residential property.\u003c/li\u003e\n                            \u003cli\u003eMust not have disposed of any private residential property at least 30 months before HFE letter application or EC application, from the legal completion date\u003csup style=\"background-color: inherit;\"\u003e[3]\u003c/sup\u003e\u003c/li\u003e\n                        \u003c/ul\u003e\n                        \u003c/td\u003e\n                    \u003c/tr\u003e\n                    \u003ctr\u003e\n                        \u003ctd\u003e\n                        \u003cul\u003e\n                            \u003cli\u003eBuying a non-subsidised resale \u003cspan\u003eunclassified\u003c/span\u003e\u003cspan\u003e/ \u003c/span\u003eStandard flat with or without Proximity Housing Grant\u003c/li\u003e\n                            \u003cli\u003eBuying a short-lease 2-room Flexi flat or Community Care Apartment from HDB (see \u003ca rel=\"noopener noreferrer\" href=\"/buying-a-flat/flat-grant-and-loan-eligibility/seniors\" target=\"_blank\"\u003eSeniors\u003c/a\u003e page)\u003c/li\u003e\n                        \u003c/ul\u003e\n                        \u003c/td\u003e\n                        \u003ctd\u003eIf you own or have an interest in any local or overseas private residential property at the time of HFE letter application, you must dispose of the interest in the private residential property, based on the legal completion of the disposal, within 6 months of completing your flat purchase\u003csup\u003e[4]\u003c/sup\u003e.\u003cbr /\u003e\n                        \u003c/td\u003e\n                    \u003c/tr\u003e\n                    \u003ctr\u003e\n                        \u003ctd\u003e\n                        \u003cp\u003ePrivate residential property\u003c/p\u003e\n                        \u003c/td\u003e\n                        \u003ctd\u003e\n                        \u003cp\u003eN/A\u003c/p\u003e\n                        \u003c/td\u003e\n                    \u003c/tr\u003e\n                \u003c/tbody\u003e\n            \u003c/table\u003e\n            \u003cp class=\"Footnote\"\u003e\u003cspan\u003e[1] Prime flats include Prime Location Public Housing (PLH) flats sold before October 2024 sales exercise. The eligibility criteria for resale Prime flats follow the prevailing BTO eligibility criteria.\u003c/span\u003e\u003c/p\u003e\n            \u003cp class=\"Footnote\"\u003e\u003cspan\u003e[2] Unclassified resale flats refer to flats sold before October 2024 sales exercise and not classified as Standard, Plus or Prime.\u003c/span\u003e\u003c/p\u003e\n            \u003cp class=\"Footnote\"\u003e[3] For example, if your private residential property was disposed of on 1 July 2024, based on the legal completion date of disposal, you may apply for an HFE letter to buy a flat from HDB, or a resale Plus or Prime flat, or take an HDB housing loan on or after 1 January 2027.\u003c/p\u003e\n            \u003cp class=\"Footnote\"\u003e[4] For example, if your flat purchase was completed on 1 July 2024, the legal completion of your private residential property sale must be on or before 31 December 2024.\u003c/p\u003e\n            \u003cp\u003eRead the \u003ca href=\"/buying-a-flat/flat-grant-and-loan-eligibility\" target=\"_self\"\u003eeligibility conditions\u003c/a\u003e for buying an HDB flat.\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd\u003e\n            \u003cp\u003e\u003cstrong\u003eResale levy\u003c/strong\u003e\u003c/p\u003e\n            \u003c/td\u003e\n            \u003ctd\u003e\n            \u003cp\u003eThe resale levy is meant to reduce the housing subsidy on the buyers' second subsidised HDB flat or EC unit from a property developer. It ensures a fairer allocation of housing subsidies among home buyers.\u003c/p\u003e\n            \u003cp\u003eYou are liable to pay a resale levy of $55,000\u003csup\u003e[5]\u003c/sup\u003e when you sell an EC unit (bought with the CPF Housing Grant; or bought from \u003ca rel=\"noopener noreferrer\" href=\"https://www.hdb.gov.sg/-/media/business-partners/land-developers-and-land-users/buying-land-land-sales/sites-sold-by-hdb/ec-sites-sold.pdf?sc_lang=en\u0026amp;hash=60DB83045B226461EC2B9CDEC5DBECF0\" target=\"_blank\"\u003ea project where the EC tender closed on or after 9 Dec 2013\u003c/a\u003e), after waiting out 30 months:\u003c/p\u003e\n            \u003cul\u003e\n                \u003cli\u003eBuy a subsidised flat from HDB; or\u003c/li\u003e\n                \u003cli\u003eBuy an EC unit from a property developer\u003c/li\u003e\n            \u003c/ul\u003e\n            \u003cp\u003eIf you do not intend to buy a subsidised flat from HDB or a second EC unit from a property developer, and choose to buy a resale flat or a private residential property, you need not pay the resale levy.\u003c/p\u003e\n            \u003cp class=\"Footnote\"\u003e\u003cspan\u003e[5] The resale levy liable is $55,000 for families and $27,500 for singles.\u003c/span\u003e\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n    \u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch2\u003eRoles and responsibilities of owning an EC unit\u003c/h2\u003e\n\u003cp\u003eThe roles and responsibilities of staying in an EC unit is different from staying in an HDB flat. Read \u003ca rel=\"noopener noreferrer\" href=\"https://www1.bca.gov.sg/home-and-building-owners/condo-strata/condo-living-be-condo-savvy/before-owning-a-condo--what-to-know/\" target=\"_blank\"\u003eBCA\u0026rsquo;s guide\u003c/a\u003e to understand the considerations of owning a condominium.\u003c/p\u003e"}}}],"landing-page"
