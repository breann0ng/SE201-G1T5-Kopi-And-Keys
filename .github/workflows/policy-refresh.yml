# Monthly re-snapshot of official HDB/CPF policy pages (owner: Sandra).
#
# 1. Runs scripts/scraping/refresh.py, which writes data/policy_snapshots/<date>/
#    and a diff report against the ACTIVE snapshot (the one the advisor serves).
# 2. Only a ready snapshot is committed/pushed. Access blocks retain the old data.
#    A ready snapshot's chunks and topic cards are pre-built into their own date folders.
# 3. If anything changed, opens a GitHub Issue linking the diff report.
#
# Going live is manual: after reviewing, a person changes data/policy_snapshots/ACTIVE
# to the new date. See data/README.md.
name: Policy refresh

on:
  schedule:
    - cron: "0 2 1 * *"   # 02:00 UTC on the 1st of each month = 10:00 SGT
  workflow_dispatch:       # manual "Run workflow" button, e.g. after a policy announcement

permissions:
  contents: write
  issues: write

concurrency:
  group: policy-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/scraping/requirements.txt

      - name: Install scraping dependencies
        run: pip install -r scripts/scraping/requirements.txt

      # An explicit source block is handled with a notice; other errors still fail.
      - name: Re-snapshot, extract, verify and diff
        id: refresh
        working-directory: scripts/scraping
        run: python refresh.py --github-actions

      - name: Save refresh diagnostics
        if: always() && steps.refresh.outputs.date != ''
        uses: actions/upload-artifact@v6
        with:
          name: policy-refresh-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          # The explicitly named status report lives under the hidden .local directory.
          include-hidden-files: true
          path: |
            .local/reports/policy-refresh-status.json
            data/policy_snapshots/${{ steps.refresh.outputs.date }}/fetch_log.json

      # Pre-build the candidate's chunks and topic cards into their own date folders
      # (data/policy_chunks/<date>/, data/topic_cards/<date>/), so the reviewer sees whether
      # they build and validate. ACTIVE, and the chunks and cards it serves, are unchanged.
      # A failure here does not stop publication; the review issue says to rebuild locally.
      - name: Pre-build candidate chunks and topic cards
        if: steps.refresh.outputs.outcome == 'ready'
        id: candidate
        continue-on-error: true
        working-directory: scripts/scraping
        env:
          DATE: ${{ steps.refresh.outputs.date }}
        run: |
          python chunk.py "$DATE"
          python build_cards.py "$DATE"
          python validate.py "$DATE"

      - name: Commit and push the new snapshot to main
        if: steps.refresh.outputs.outcome == 'ready'
        id: push
        env:
          CANDIDATE: ${{ steps.candidate.outcome }}
        run: |
          DATE=$(TZ=Asia/Singapore date +%F)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/policy_snapshots/$DATE" scripts/scraping/seeds.json
          if [ "$CANDIDATE" = "success" ]; then
            git add "data/policy_chunks/$DATE" "data/topic_cards/$DATE" data/policy_chunks/chunk_id_registry.json
          fi
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: policy snapshot $DATE (not active until reviewed)"
          # Teammates may have pushed meanwhile; our commit only adds a new folder.
          git pull --rebase origin main
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Open a review issue if anything changed
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ steps.push.outputs.date }}
          CANDIDATE: ${{ steps.candidate.outcome }}
        run: |
          if [ "$CANDIDATE" = "success" ]; then
            BUILD="Candidate chunks and topic cards were built into \`data/policy_chunks/$DATE/\` and \`data/topic_cards/$DATE/\` and passed \`validate.py\`."
          else
            BUILD="**The candidate chunks/cards did not build or validate.** Rebuild locally: \`cd scripts/scraping && python chunk.py $DATE && python build_cards.py $DATE && python validate.py $DATE\` (see the job log)."
          fi
          REPORT=$(ls data/policy_snapshots/$DATE/changes_since_*.json 2>/dev/null | head -1)
          if [ -z "$REPORT" ]; then echo "No diff report (first snapshot)."; exit 0; fi
          python - "$REPORT" > issue.env <<'EOF'
          import json, sys
          r = json.load(open(sys.argv[1], encoding="utf-8"))
          fig = sum(1 for c in r["changed"] if c["figures_removed"] or c["figures_added"])
          n = len(r["changed"]) + len(r["added"]) + len(r["removed"]) + len(r["status_changed"])
          print(f"TOTAL={n}\nFIGS={fig}\nOLD={r['old']}")
          EOF
          . ./issue.env
          if [ "$TOTAL" = "0" ]; then echo "No changes since $OLD."; exit 0; fi
          URL="${{ github.server_url }}/${{ github.repository }}/blob/main/data/policy_snapshots/$DATE/changes_since_$OLD.md"
          gh issue create \
            --title "Policy snapshot $DATE: $FIGS page(s) with figure changes, $TOTAL change(s) since $OLD" \
            --body "A new policy snapshot was pushed to \`data/policy_snapshots/$DATE/\`. It is **not live yet**: the advisor still serves \`$OLD\`.

          **Diff report:** $URL

          $BUILD

          **To review**
          - [ ] Check each changed page against the live site. Pages with figure changes are listed first.
          - [ ] For real changes: mark the old chunks \`superseded: true\` and re-check the topic cards that cite them.
          - [ ] Note anything unresolved in \`data/policy_snapshots/$DATE/README.md\`.
          - [ ] Go live: change \`data/policy_snapshots/ACTIVE\` to \`$DATE\` and push.

          If the snapshot looks broken (e.g. pages missing), leave \`ACTIVE\` unchanged and close this issue."
