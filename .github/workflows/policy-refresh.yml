# Change detection only. A candidate PR never changes ACTIVE, chunks or the index.
name: Policy refresh

on:
  schedule:
    - cron: "17 2 * * 1"  # Monday 10:17 SGT; scheduled runs may be delayed.
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: policy-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Manual runs must also use the default branch, never unreviewed branch code.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/scraping/requirements.txt

      - name: Install scraping dependencies
        run: pip install -r scripts/scraping/requirements.txt

      - name: Re-snapshot, extract, verify and diff
        id: refresh
        working-directory: scripts/scraping
        run: python refresh.py --github-actions

      - name: Save refresh evidence
        if: always() && steps.refresh.outputs.date != ''
        uses: actions/upload-artifact@v6
        with:
          name: policy-refresh-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          include-hidden-files: true
          path: |
            .local/reports/policy-refresh-status.json
            data/policy_snapshots/${{ steps.refresh.outputs.date }}/
            scripts/scraping/seeds.json

      # Still report after fetch/extraction failure. Unexpected errors remain red.
      - name: Report status and prepare a draft review PR
        if: always() && steps.refresh.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/policy_watch.py --publish

      - name: Save watcher report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: policy-watch-status-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          include-hidden-files: true
          path: .local/reports/policy-watch-status.json
          if-no-files-found: warn
