[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kopi-and-keys"
version = "0.1.0"
description = "HDB policy and resale benchmark advisor backend foundation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "langgraph>=1,<2",
    "pydantic>=2.10,<3",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "langsmith>=0.3,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
# Policy Vector Index (scripts/build_policy_index.py). Without it, retrieval falls back to BM25.
rag = ["chromadb>=1.0,<2"]

[project.scripts]
kopi-keys-synthesize = "kopi_keys.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
kopi_keys = ["rules/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
