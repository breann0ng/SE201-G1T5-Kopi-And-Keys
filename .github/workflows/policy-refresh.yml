# Change detection only. A candidate PR never changes ACTIVE, chunks or the index.
name: Policy refresh

on:
  schedule:
    - cron: "17 2 * * 1"  # Monday 10:17 SGT; scheduled runs may be delayed.
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: policy-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Manual runs must also use the default branch, never unreviewed branch code.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/scraping/requirements.txt

      - name: Install scraping dependencies
        run: pip install -r scripts/scraping/requirements.txt

      - name: Re-snapshot, extract, verify and diff
        id: refresh
        working-directory: scripts/scraping
        run: python refresh.py --github-actions

      # Preserve candidate build checks from main; only inactive date folders.
      - name: Pre-build candidate chunks and topic cards
        if: steps.refresh.outputs.outcome == 'ready'
        id: candidate
        continue-on-error: true
        working-directory: scripts/scraping
        env:
          DATE: ${{ steps.refresh.outputs.date }}
        run: |
          python chunk.py "$DATE"
          python build_cards.py "$DATE"
          python validate.py "$DATE"

      - name: Save refresh evidence
        if: always() && steps.refresh.outputs.date != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: policy-refresh-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          include-hidden-files: true
          path: |
            .local/reports/policy-refresh-status.json
            data/policy_snapshots/${{ steps.refresh.outputs.date }}/
            scripts/scraping/seeds.json
            data/policy_chunks/${{ steps.refresh.outputs.date }}/
            data/topic_cards/${{ steps.refresh.outputs.date }}/
            data/policy_chunks/chunk_id_registry.json

      # Still report after fetch/extraction failure. Unexpected errors remain red.
      - name: Report status and prepare a draft review PR
        if: always() && steps.refresh.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          POLICY_CANDIDATE_BUILD_STATUS: ${{ steps.candidate.outcome }}
        run: python scripts/policy_watch.py --publish

      - name: Save watcher report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: policy-watch-status-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          include-hidden-files: true
          path: .local/reports/policy-watch-status.json
          if-no-files-found: warn
