[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kopi-and-keys"
version = "0.1.0"
description = "HDB policy and resale benchmark advisor backend foundation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "langgraph>=1,<2",
    "pydantic>=2.10,<3",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
kopi-keys-synthesize = "kopi_keys.midpoint.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
